[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shockarb"
version = "3.0.0"
description = "Geopolitical crisis mispricing detection system"
readme = {file = "docs/README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "yfinance>=0.2",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=14.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[project.scripts]
shockarb = "shockarb.cli:main"

[tool.setuptools.packages.find]
# Discovers both shockarb/ and datamgr/ automatically
where = ["."]
include = ["shockarb*", "datamgr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["shockarb", "datamgr"]
omit = ["tests/*"]
